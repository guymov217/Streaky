name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE != '' }}
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies and copy the web app into the Android project
        run: |
          npm ci
          npx cap sync android

      - name: Build signed release APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          # The key file itself is the secret; this password only wraps it.
          STREAKY_KEYSTORE_PASSWORD: dr-bellini-release
        run: |
          export STREAKY_KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$STREAKY_KEYSTORE_FILE"
          else
            echo "::warning::The ANDROID_KEYSTORE secret is not set, so this build is signed with a temporary key and is not published."
            keytool -genkeypair -storetype PKCS12 -keystore "$STREAKY_KEYSTORE_FILE" -alias drbellini -keyalg EC -groupname secp256r1 \
              -validity 2 -storepass "$STREAKY_KEYSTORE_PASSWORD" -keypass "$STREAKY_KEYSTORE_PASSWORD" -dname "CN=Temporary"
          fi
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }} -PversionName=$VERSION
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dr-bellini.apk"
          rm -f "$STREAKY_KEYSTORE_FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: dr-bellini-${{ env.VERSION }}
          path: dr-bellini.apk

      - name: Publish release
        if: env.HAS_KEYSTORE == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dr-bellini.apk \
            --target "$GITHUB_SHA" \
            --title "Dr Bellini $VERSION" \
            --notes "להורדה והתקנה באנדרואיד: הורידו את dr-bellini.apk ופתחו אותו בטלפון." \
            --latest
